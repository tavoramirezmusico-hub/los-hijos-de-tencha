<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Administrativo | Los Hijos de Tencha</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: #0a0a0a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image:
                radial-gradient(ellipse at 30% 20%, rgba(255, 204, 0, 0.05) 0%, transparent 60%),
                radial-gradient(ellipse at 70% 80%, rgba(255, 204, 0, 0.03) 0%, transparent 50%);
        }

        .login-container {
            background: #141414;
            padding: 50px 40px;
            border-radius: 24px;
            max-width: 420px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8);
            position: relative;
            overflow: hidden;
        }

        .login-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #ffcc00, #ff8800);
        }

        .login-logo {
            text-align: center;
            margin-bottom: 35px;
        }

        .login-logo img {
            width: 120px;
            height: auto;
            margin-bottom: 15px;
        }

        .login-logo h1 {
            color: #fff;
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .login-logo span {
            color: #ffcc00;
        }

        .login-logo p {
            color: #666;
            font-size: 0.85rem;
            margin-top: 5px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: #aaa;
            font-size: 0.85rem;
            font-weight: 500;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .form-group .input-wrapper {
            position: relative;
        }

        .form-group .input-wrapper i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #555;
            font-size: 1rem;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px 14px 46px;
            background: #1c1c1c;
            border: 2px solid #2a2a2a;
            border-radius: 12px;
            color: #fff;
            font-size: 1rem;
            font-family: 'Poppins', sans-serif;
            transition: all 0.3s ease;
            outline: none;
        }

        .form-group input:focus {
            border-color: #ffcc00;
            background: #222;
            box-shadow: 0 0 0 4px rgba(255, 204, 0, 0.08);
        }

        .form-group input::placeholder {
            color: #444;
        }

        .form-group .toggle-password {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #555;
            cursor: pointer;
            font-size: 1rem;
            transition: color 0.3s;
        }

        .form-group .toggle-password:hover {
            color: #ffcc00;
        }

        .btn-login {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #ffcc00, #f5a623);
            color: #000;
            border: none;
            border-radius: 12px;
            font-size: 1.05rem;
            font-weight: 700;
            font-family: 'Poppins', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(255, 204, 0, 0.25);
        }

        .btn-login:active {
            transform: scale(0.97);
        }

        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .error-message {
            background: rgba(211, 47, 47, 0.12);
            border: 1px solid rgba(211, 47, 47, 0.25);
            color: #ff6b6b;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 0.9rem;
            margin-bottom: 20px;
            display: none;
            align-items: center;
            gap: 10px;
        }

        .error-message.show {
            display: flex;
        }

        .error-message i {
            font-size: 1.1rem;
        }

        .login-footer {
            text-align: center;
            margin-top: 25px;
            color: #444;
            font-size: 0.8rem;
        }

        .login-footer a {
            color: #ffcc00;
            text-decoration: none;
            transition: color 0.3s;
        }

        .login-footer a:hover {
            color: #fff;
        }

        .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(0, 0, 0, 0.1);
            border-top: 2px solid #000;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        .btn-login.loading .spinner {
            display: inline-block;
        }

        .btn-login.loading .btn-text {
            display: none;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 35px 25px;
                margin: 20px;
                border-radius: 18px;
            }

            .login-logo img {
                width: 90px;
            }

            .login-logo h1 {
                font-size: 1rem;
            }

            .form-group input {
                padding: 12px 14px 12px 42px;
                font-size: 0.9rem;
            }
        }
    </style>
</head>

<body>

    <div class="login-container">
        <div class="login-logo">
            <img src="../img/logo.webp" alt="Los Hijos de Tencha">
            <h1>Panel de <span>Administración</span></h1>
            <p>Acceso restringido · Personal autorizado</p>
        </div>

        <div id="errorMessage" class="error-message">
            <i class="fa-solid fa-circle-exclamation"></i>
            <span id="errorText">Contraseña incorrecta. Intenta de nuevo.</span>
        </div>

        <form id="loginForm" onsubmit="return handleLogin(event)">
            <div class="form-group">
                <label for="password">🔐 Contraseña</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-key"></i>
                    <input type="password" id="password" placeholder="Ingresa tu contraseña" autofocus>
                    <button type="button" class="toggle-password" onclick="togglePassword()">
                        <i class="fa-solid fa-eye" id="eyeIcon"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn-login" id="loginBtn">
                <span class="btn-text"><i class="fa-solid fa-right-to-bracket"></i> Acceder</span>
                <span class="spinner"></span>
            </button>
        </form>

        <div class="login-footer">
            <a href="../index.html">← Volver al sitio</a>
        </div>
    </div>

    <script>
        const PASSWORD_HASH = 'd0b15b8b8f7a2e7e8e1e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2c3d4e5f6a7b8c9';

        async function hashPassword(password) {
            const encoder = new TextEncoder();
            const data = encoder.encode(password);
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        async function handleLogin(event) {
            event.preventDefault();

            const passwordInput = document.getElementById('password');
            const errorMessage = document.getElementById('errorMessage');
            const errorText = document.getElementById('errorText');
            const loginBtn = document.getElementById('loginBtn');
            const password = passwordInput.value.trim();

            errorMessage.classList.remove('show');

            if (!password) {
                errorText.textContent = '⚠️ Por favor, ingresa la contraseña.';
                errorMessage.classList.add('show');
                passwordInput.focus();
                return false;
            }

            loginBtn.classList.add('loading');
            loginBtn.disabled = true;

            try {
                const inputHash = await hashPassword(password);

                if (inputHash === PASSWORD_HASH) {
                    sessionStorage.setItem('adminAuth', 'authenticated');
                    sessionStorage.setItem('adminLoginTime', Date.now().toString());
                    window.location.href = 'dashboard.html';
                } else {
                    errorText.textContent = '❌ Contraseña incorrecta. Intenta de nuevo.';
                    errorMessage.classList.add('show');
                    passwordInput.value = '';
                    passwordInput.focus();
                    loginBtn.classList.remove('loading');
                    loginBtn.disabled = false;
                }
            } catch (error) {
                console.error('Error de autenticación:', error);
                errorText.textContent = '⚠️ Error al verificar la contraseña.';
                errorMessage.classList.add('show');
                loginBtn.classList.remove('loading');
                loginBtn.disabled = false;
            }

            return false;
        }

        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eyeIcon');

            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.className = 'fa-solid fa-eye-slash';
            } else {
                passwordInput.type = 'password';
                eyeIcon.className = 'fa-solid fa-eye';
            }
        }

        document.addEventListener('DOMContentLoaded', function () {
            const auth = sessionStorage.getItem('adminAuth');
            const loginTime = sessionStorage.getItem('adminLoginTime');

            if (auth === 'authenticated' && loginTime) {
                const timeElapsed = Date.now() - parseInt(loginTime);
                if (timeElapsed < 14400000) {
                    window.location.href = 'dashboard.html';
                    return;
                } else {
                    sessionStorage.removeItem('adminAuth');
                    sessionStorage.removeItem('adminLoginTime');
                }
            }

            document.getElementById('password').focus();

            document.getElementById('password').addEventListener('keydown', function (e) {
                if (e.key === 'Enter') {
                    document.getElementById('loginForm').dispatchEvent(new Event('submit'));
                }
            });
        });

        if (window.performance && window.performance.navigation &&
            window.performance.navigation.type === 2) {
            window.location.reload();
        }
    </script>

</body>

</html>
