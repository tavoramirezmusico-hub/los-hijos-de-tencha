<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador WhatsApp | Los Hijos de Tencha</title>

    <!-- Firebase solo para guardar historial -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: #121212;
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .header {
            margin-bottom: 25px;
        }

        .header h1 {
            font-size: 1.8rem;
            font-weight: 800;
        }

        .header h1 span {
            color: #ffcc00;
        }

        .header p {
            color: #888;
            font-size: 0.95rem;
            margin-top: 4px;
        }

        .card {
            background: #1a1a2e;
            border-radius: 16px;
            padding: 30px;
            border: 1px solid #333;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 6px;
        }

        .form-group label i {
            color: #ffcc00;
            margin-right: 6px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #333;
            border-radius: 8px;
            font-family: 'Poppins', sans-serif;
            font-size: 0.9rem;
            background: #121212;
            color: #fff;
            transition: all 0.3s ease;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #ffcc00;
            box-shadow: 0 0 0 3px rgba(255, 204, 0, 0.15);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        .helper-text {
            font-size: 0.75rem;
            color: #666;
            margin-top: 4px;
        }

        .btn-generate {
            background: #ffcc00;
            color: #1a1a2e;
            border: none;
            padding: 12px 28px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            justify-content: center;
        }

        .btn-generate:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 204, 0, 0.3);
        }

        .btn-generate:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .result-box {
            display: none;
            margin-top: 20px;
            padding: 20px;
            background: rgba(255, 204, 0, 0.05);
            border: 1px solid #ffcc00;
            border-radius: 8px;
            animation: fadeIn 0.4s ease;
        }

        .result-box.show {
            display: block;
        }

        .result-box .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .result-box .result-header h3 {
            font-size: 1rem;
            font-weight: 700;
            color: #ffcc00;
        }

        .result-box .result-header h3 i {
            margin-right: 8px;
        }

        .result-box .result-text {
            font-size: 0.95rem;
            line-height: 1.7;
            padding: 16px;
            background: #121212;
            border-radius: 8px;
            border: 1px solid #333;
            white-space: pre-wrap;
            word-break: break-word;
            min-height: 80px;
            color: #fff;
        }

        .result-box .result-text.loading {
            color: #888;
            font-style: italic;
        }

        .result-actions {
            display: flex;
            gap: 10px;
            margin-top: 14px;
            flex-wrap: wrap;
        }

        .result-actions .btn-action {
            padding: 8px 18px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #121212;
            color: #fff;
            border: 1px solid #333;
        }

        .result-actions .btn-action:hover {
            transform: translateY(-2px);
        }

        .result-actions .btn-copy {
            background: #ffcc00;
            color: #1a1a2e;
            border-color: #ffcc00;
        }

        .result-actions .btn-copy:hover {
            background: #e6b800;
            box-shadow: 0 4px 12px rgba(255, 204, 0, 0.3);
        }

        .result-actions .btn-save {
            background: #2ecc71;
            color: #fff;
            border-color: #2ecc71;
        }

        .result-actions .btn-save:hover {
            background: #27ae60;
            box-shadow: 0 4px 12px rgba(46, 204, 113, 0.3);
        }

        .result-actions .btn-whatsapp {
            background: #25D366;
            color: #fff;
            border-color: #25D366;
        }

        .result-actions .btn-whatsapp:hover {
            background: #1da851;
            box-shadow: 0 4px 12px rgba(37, 211, 102, 0.3);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.5;
            }
        }

        .pulsing {
            animation: pulse 1.2s ease-in-out infinite;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #1a1a2e;
            color: #fff;
            padding: 14px 24px;
            border-radius: 8px;
            border: 1px solid #333;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            z-index: 9999;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.4s ease;
            max-width: 400px;
            font-size: 0.9rem;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .toast.success {
            border-color: #2ecc71;
        }

        .toast.error {
            border-color: #e74c3c;
        }

        .toast.warning {
            border-color: #f39c12;
        }

        .history-list {
            list-style: none;
            max-height: 300px;
            overflow-y: auto;
        }

        .history-list li {
            padding: 12px 0;
            border-bottom: 1px solid #333;
            display: flex;
            align-items: flex-start;
            gap: 12px;
            font-size: 0.85rem;
        }

        .history-list li:last-child {
            border-bottom: none;
        }

        .history-list li .history-icon {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(255, 204, 0, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffcc00;
            flex-shrink: 0;
            font-size: 0.8rem;
        }

        .history-list li .history-content {
            flex: 1;
            min-width: 0;
        }

        .history-list li .history-content .history-text {
            font-weight: 500;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .history-list li .history-content .history-meta {
            color: #888;
            font-size: 0.7rem;
        }

        .history-list li .history-actions {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
        }

        .history-list li .history-actions button {
            background: none;
            border: none;
            cursor: pointer;
            color: #888;
            padding: 4px 6px;
            border-radius: 4px;
            transition: all 0.3s ease;
            font-size: 0.7rem;
        }

        .history-list li .history-actions button:hover {
            background: #333;
            color: #fff;
        }

        .history-list li .history-actions .btn-reuse {
            color: #ffcc00;
        }

        .history-list li .history-actions .btn-reuse:hover {
            background: rgba(255, 204, 0, 0.15);
        }

        .empty-history {
            color: #888;
            text-align: center;
            padding: 20px 0;
            font-size: 0.9rem;
        }

        .empty-history i {
            display: block;
            font-size: 2rem;
            margin-bottom: 10px;
            opacity: 0.5;
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .history-header h3 {
            font-size: 1.1rem;
            font-weight: 700;
        }

        .history-header h3 i {
            color: #ffcc00;
            margin-right: 8px;
        }

        .btn-danger-sm {
            background: #d32f2f;
            color: #fff;
            border: none;
            padding: 6px 14px;
            border-radius: 8px;
            font-family: 'Poppins', sans-serif;
            font-size: 0.7rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-danger-sm:hover {
            background: #b71c1c;
        }

        @media (max-width: 768px) {
            .card {
                padding: 20px;
            }

            .form-row {
                grid-template-columns: 1fr;
                gap: 0;
            }

            .header h1 {
                font-size: 1.4rem;
            }

            .result-actions {
                flex-direction: column;
            }

            .result-actions .btn-action {
                width: 100%;
                justify-content: center;
            }
        }

        @media (max-width: 480px) {
            .card {
                padding: 15px;
            }

            .btn-generate {
                font-size: 0.85rem;
                padding: 10px 20px;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <!-- HEADER -->
        <div class="header">
            <h1>Generador de Textos <span>WhatsApp</span></h1>
            <p>Crea mensajes profesionales con inteligencia artificial (Gemini).</p>
        </div>

        <!-- CARD PRINCIPAL -->
        <div class="card">
            <div class="form-group">
                <label for="tema"><i class="fa-solid fa-pen"></i> Tema del mensaje</label>
                <input type="text" id="tema" placeholder="Ej: Oferta de camisetas, Recordatorio..." />
                <div class="helper-text">Describe brevemente de qué quieres que trate el mensaje.</div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="tono"><i class="fa-solid fa-face-smile"></i> Tono</label>
                    <select id="tono">
                        <option value="formal">Formal</option>
                        <option value="amigable" selected>Amigable</option>
                        <option value="urgente">Urgente</option>
                        <option value="inspirador">Inspirador</option>
                        <option value="humoristico">Humorístico</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="longitud"><i class="fa-solid fa-ruler"></i> Longitud</label>
                    <select id="longitud">
                        <option value="corto">Corto (1-2 líneas)</option>
                        <option value="medio" selected>Medio (3-5 líneas)</option>
                        <option value="largo">Largo (6+ líneas)</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label for="contexto"><i class="fa-solid fa-circle-info"></i> Contexto adicional (opcional)</label>
                <textarea id="contexto" placeholder="Ej: Descuento del 20% para clientes frecuentes"
                    rows="2"></textarea>
            </div>

            <button class="btn-generate" id="btnGenerar">
                <i class="fa-solid fa-wand-magic-sparkles"></i> Generar mensaje con IA
            </button>

            <!-- RESULTADO -->
            <div class="result-box" id="resultado">
                <div class="result-header">
                    <h3><i class="fa-solid fa-message"></i> Mensaje generado</h3>
                    <span style="font-size:0.7rem; color:#888;" id="tiempoGeneracion"></span>
                </div>
                <div class="result-text" id="mensajeGenerado">✍️ Escribe un tema y haz clic en "Generar"</div>
                <div class="result-actions">
                    <button class="btn-action btn-copy" id="btnCopiar"><i class="fa-regular fa-clipboard"></i>
                        Copiar</button>
                    <button class="btn-action btn-whatsapp" id="btnWhatsApp"><i class="fa-brands fa-whatsapp"></i>
                        WhatsApp</button>
                    <button class="btn-action btn-save" id="btnGuardar"><i class="fa-regular fa-floppy-disk"></i>
                        Guardar</button>
                    <button class="btn-action" id="btnLimpiar"><i class="fa-regular fa-trash-can"></i> Limpiar</button>
                </div>
            </div>
        </div>

        <!-- HISTORIAL -->
        <div class="history-header">
            <h3><i class="fa-regular fa-clock"></i> Historial de mensajes</h3>
            <button class="btn-danger-sm" id="btnBorrarHistorial"><i class="fa-regular fa-trash-can"></i> Borrar
                todo</button>
        </div>
        <div class="card" style="padding:10px 20px;">
            <ul class="history-list" id="historialList">
                <li class="empty-history">
                    <i class="fa-regular fa-inbox"></i>
                    No hay mensajes guardados
                </li>
            </ul>
        </div>
    </div>

    <!-- TOAST -->
    <div id="toast" class="toast"></div>

    <script>
        // ============================================================
        // CONFIGURACIÓN DE FIREBASE
        // ============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyDvp_6UFymZZnqxMyL6yobJ3twLMvVkThw",
            authDomain: "base-entradas-tenchos.firebaseapp.com",
            projectId: "base-entradas-tenchos",
            storageBucket: "base-entradas-tenchos.firebasestorage.app",
            messagingSenderId: "273676503007",
            appId: "1:273676503007:web:56180c485b648ef076a66a"
        };

        // Inicializar Firebase SOLO UNA VEZ
        let db = null;
        try {
            if (typeof firebase !== 'undefined') {
                if (!firebase.apps.length) {
                    firebase.initializeApp(firebaseConfig);
                }
                db = firebase.firestore();
                console.log('✅ Firebase conectado');
            } else {
                console.warn('⚠️ Firebase no cargado');
            }
        } catch (e) {
            console.warn('⚠️ Error Firebase:', e);
        }

        // ============================================================
        // CONFIGURACIÓN
        // ============================================================
        const WORKER_URL = 'https://generador-whatsapp.tavoramirezmusico.workers.dev/';

        // ============================================================
        // DOM ELEMENTS
        // ============================================================
        const tema = document.getElementById('tema');
        const tono = document.getElementById('tono');
        const longitud = document.getElementById('longitud');
        const contexto = document.getElementById('contexto');
        const btnGenerar = document.getElementById('btnGenerar');
        const btnCopiar = document.getElementById('btnCopiar');
        const btnWhatsApp = document.getElementById('btnWhatsApp');
        const btnGuardar = document.getElementById('btnGuardar');
        const btnLimpiar = document.getElementById('btnLimpiar');
        const btnBorrarHistorial = document.getElementById('btnBorrarHistorial');
        const resultado = document.getElementById('resultado');
        const mensaje = document.getElementById('mensajeGenerado');
        const tiempo = document.getElementById('tiempoGeneracion');
        const historialList = document.getElementById('historialList');
        const toast = document.getElementById('toast');

        // ============================================================
        // FUNCIONES
        // ============================================================

        function mostrarToast(texto, tipo = 'info') {
            toast.textContent = texto;
            toast.className = 'toast show';
            if (tipo === 'success') toast.classList.add('success');
            else if (tipo === 'error') toast.classList.add('error');
            else if (tipo === 'warning') toast.classList.add('warning');
            clearTimeout(toast._timeout);
            toast._timeout = setTimeout(() => toast.classList.remove('show'), 4000);
        }

        function sanitizar(texto) {
            if (!texto) return '';
            const div = document.createElement('div');
            div.textContent = texto;
            return div.innerHTML;
        }

        function formatearFecha(fecha) {
            if (!fecha || isNaN(fecha.getTime())) return 'Fecha inválida';
            return fecha.toLocaleDateString('es-ES', {
                day: '2-digit',
                month: 'short',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        // ============================================================
        // GENERAR
        // ============================================================
        async function generarTexto() {
            const temaVal = tema.value.trim();
            if (!temaVal) {
                mostrarToast('⚠️ Escribe un tema para el mensaje.', 'warning');
                tema.focus();
                return;
            }

            resultado.classList.add('show');
            mensaje.className = 'result-text loading pulsing';
            mensaje.textContent = '⏳ Generando mensaje con IA...';
            tiempo.textContent = '';
            btnGenerar.disabled = true;
            btnGenerar.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Generando...';

            try {
                const response = await fetch(WORKER_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        tema: temaVal,
                        tono: tono.value,
                        longitud: longitud.value,
                        contexto: contexto.value.trim()
                    })
                });

                const data = await response.json();

                if (data.success) {
                    mensaje.className = 'result-text';
                    mensaje.textContent = data.texto;
                    tiempo.textContent = '✅ Generado ' + new Date().toLocaleString();
                    mostrarToast('✅ Mensaje generado correctamente', 'success');
                } else {
                    mensaje.className = 'result-text';
                    mensaje.textContent = '❌ Error: ' + (data.error || 'No se pudo generar.');
                    mostrarToast('❌ Error al generar', 'error');
                }
            } catch (error) {
                mensaje.className = 'result-text';
                mensaje.textContent = '❌ Error de conexión. Intenta de nuevo.';
                mostrarToast('❌ Error de conexión', 'error');
            }

            btnGenerar.disabled = false;
            btnGenerar.innerHTML = '<i class="fa-solid fa-wand-magic-sparkles"></i> Generar mensaje con IA';
        }

        // ============================================================
        // COPIAR
        // ============================================================
        function copiarTexto() {
            const texto = mensaje.textContent;
            if (!texto || texto.includes('❌') || texto.includes('⏳')) {
                mostrarToast('⚠️ No hay mensaje válido para copiar.', 'warning');
                return;
            }
            navigator.clipboard.writeText(texto)
                .then(() => mostrarToast('✅ Texto copiado', 'success'))
                .catch(() => {
                    const ta = document.createElement('textarea');
                    ta.value = texto;
                    document.body.appendChild(ta);
                    ta.select();
                    document.execCommand('copy');
                    document.body.removeChild(ta);
                    mostrarToast('✅ Texto copiado', 'success');
                });
        }

        // ============================================================
        // WHATSAPP
        // ============================================================
        function enviarWhatsApp() {
            const texto = mensaje.textContent;
            if (!texto || texto.includes('❌') || texto.includes('⏳')) {
                mostrarToast('⚠️ No hay mensaje válido.', 'warning');
                return;
            }
            window.open('https://wa.me/?text=' + encodeURIComponent(texto), '_blank');
        }

        // ============================================================
        // GUARDAR
        // ============================================================
        async function guardarTexto() {
            const texto = mensaje.textContent;
            if (!texto || texto.includes('❌') || texto.includes('⏳')) {
                mostrarToast('⚠️ No hay mensaje válido para guardar.', 'warning');
                return;
            }

            if (!db) {
                mostrarToast('⚠️ Firestore no disponible', 'warning');
                return;
            }

            try {
                await db.collection('mensajes_generados').add({
                    texto: texto,
                    tema: tema.value.trim() || 'Sin tema',
                    tono: tono.value,
                    fecha: new Date().toISOString(),
                    usuario: 'admin'
                });
                mostrarToast('💾 Mensaje guardado', 'success');
                cargarHistorial();
            } catch (error) {
                mostrarToast('❌ Error al guardar', 'error');
            }
        }

        // ============================================================
        // LIMPIAR
        // ============================================================
        function limpiarResultado() {
            resultado.classList.remove('show');
            mensaje.textContent = '✍️ Escribe un tema y haz clic en "Generar"';
            tiempo.textContent = '';
        }

        // ============================================================
        // HISTORIAL
        // ============================================================
        async function cargarHistorial() {
            if (!db) {
                historialList.innerHTML = `<li class="empty-history"><i class="fa-solid fa-triangle-exclamation"></i>Firestore no disponible</li>`;
                return;
            }

            try {
                const snap = await db.collection('mensajes_generados')
                    .orderBy('fecha', 'desc')
                    .limit(20)
                    .get();

                if (snap.empty) {
                    historialList.innerHTML = `<li class="empty-history"><i class="fa-regular fa-inbox"></i>No hay mensajes guardados</li>`;
                    return;
                }

                let html = '';
                snap.forEach(doc => {
                    const d = doc.data();
                    const fecha = d.fecha ? new Date(d.fecha) : new Date();
                    const texto = d.texto || 'Sin texto';
                    const preview = texto.length > 60 ? texto.substring(0, 60) + '...' : texto;

                    html += `
                        <li>
                            <div class="history-icon"><i class="fa-regular fa-message"></i></div>
                            <div class="history-content">
                                <div class="history-text" title="${sanitizar(texto)}">${sanitizar(preview)}</div>
                                <div class="history-meta">
                                    <i class="fa-regular fa-tag"></i> ${sanitizar(d.tema || 'Sin tema')}
                                    ${d.tono ? '· <i class="fa-regular fa-face-smile"></i> ' + sanitizar(d.tono) : ''}
                                    · ${formatearFecha(fecha)}
                                </div>
                            </div>
                            <div class="history-actions">
                                <button class="btn-reuse" data-id="${doc.id}" title="Reutilizar"><i class="fa-solid fa-rotate-right"></i></button>
                                <button class="btn-delete" data-id="${doc.id}" title="Eliminar"><i class="fa-regular fa-trash-can"></i></button>
                            </div>
                        </li>
                    `;
                });
                historialList.innerHTML = html;

                document.querySelectorAll('.btn-reuse').forEach(b => {
                    b.addEventListener('click', function () { reutilizarMensaje(this.dataset.id); });
                });
                document.querySelectorAll('.btn-delete').forEach(b => {
                    b.addEventListener('click', function () { eliminarMensaje(this.dataset.id); });
                });

            } catch (error) {
                historialList.innerHTML = `<li class="empty-history"><i class="fa-solid fa-triangle-exclamation"></i>Error al cargar</li>`;
            }
        }

        async function reutilizarMensaje(id) {
            if (!db) return;
            try {
                const doc = await db.collection('mensajes_generados').doc(id).get();
                if (!doc.exists) return;
                const d = doc.data();
                mensaje.textContent = d.texto || 'Sin contenido';
                tiempo.textContent = '📂 Reutilizado de historial';
                resultado.classList.add('show');
                if (d.tema) tema.value = d.tema;
                if (d.tono) tono.value = d.tono;
                mostrarToast('📂 Mensaje cargado', 'success');
            } catch (error) {
                mostrarToast('❌ Error al cargar', 'error');
            }
        }

        async function eliminarMensaje(id) {
            if (!confirm('¿Eliminar este mensaje?')) return;
            if (!db) return;
            try {
                await db.collection('mensajes_generados').doc(id).delete();
                mostrarToast('🗑️ Mensaje eliminado', 'success');
                cargarHistorial();
            } catch (error) {
                mostrarToast('❌ Error al eliminar', 'error');
            }
        }

        async function borrarHistorial() {
            if (!confirm('⚠️ ¿Borrar TODO el historial?')) return;
            if (!db) return;
            try {
                const snap = await db.collection('mensajes_generados').get();
                if (snap.empty) {
                    mostrarToast('⚠️ No hay mensajes', 'warning');
                    return;
                }
                const batch = db.batch();
                snap.forEach(doc => batch.delete(doc.ref));
                await batch.commit();
                mostrarToast('🗑️ Historial borrado', 'success');
                cargarHistorial();
            } catch (error) {
                mostrarToast('❌ Error al borrar', 'error');
            }
        }

        // ============================================================
        // EVENTOS
        // ============================================================
        btnGenerar.addEventListener('click', generarTexto);
        btnCopiar.addEventListener('click', copiarTexto);
        btnWhatsApp.addEventListener('click', enviarWhatsApp);
        btnGuardar.addEventListener('click', guardarTexto);
        btnLimpiar.addEventListener('click', limpiarResultado);
        btnBorrarHistorial.addEventListener('click', borrarHistorial);

        tema.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                generarTexto();
            }
        });

        // ============================================================
        // INICIO
        // ============================================================
        document.addEventListener('DOMContentLoaded', function () {
            cargarHistorial();
            console.log('🤖 Generador WhatsApp con IA cargado');
            console.log('📡 Worker:', WORKER_URL);
            console.log('🔥 Firebase:', !!db);
        });
    </script>

</body>
