<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador WhatsApp</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: #121212;
            color: #fff;
            padding: 30px 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            max-width: 600px;
            width: 100%;
            background: #1a1a2e;
            border-radius: 16px;
            padding: 30px;
            border: 1px solid #333;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 6px;
        }

        h1 span {
            color: #ffcc00;
        }

        p.sub {
            color: #888;
            font-size: 0.9rem;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 0.85rem;
            margin-bottom: 4px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #333;
            border-radius: 8px;
            background: #121212;
            color: #fff;
            font-family: 'Poppins', sans-serif;
            font-size: 0.9rem;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #ffcc00;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        .btn {
            background: #ffcc00;
            color: #1a1a2e;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 204, 0, 0.3);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .result-box {
            display: none;
            margin-top: 16px;
            padding: 16px;
            background: rgba(255, 204, 0, 0.05);
            border: 1px solid #ffcc00;
            border-radius: 8px;
        }

        .result-box.show {
            display: block;
        }

        .result-box .text {
            font-size: 0.95rem;
            line-height: 1.6;
            padding: 12px;
            background: #121212;
            border-radius: 8px;
            border: 1px solid #333;
            min-height: 60px;
        }

        .result-box .text.loading {
            color: #888;
            font-style: italic;
        }

        .actions {
            display: flex;
            gap: 8px;
            margin-top: 12px;
            flex-wrap: wrap;
        }

        .actions button {
            padding: 6px 14px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.3s;
            background: #121212;
            color: #fff;
            border: 1px solid #333;
        }

        .actions button:hover {
            transform: translateY(-2px);
        }

        .btn-copy {
            background: #ffcc00;
            color: #1a1a2e;
            border-color: #ffcc00 !important;
        }

        .btn-wa {
            background: #25D366;
            color: #fff;
            border-color: #25D366 !important;
        }

        .btn-save {
            background: #2ecc71;
            color: #fff;
            border-color: #2ecc71 !important;
        }

        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #1a1a2e;
            padding: 12px 20px;
            border-radius: 8px;
            border: 1px solid #333;
            font-size: 0.85rem;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.4s;
            max-width: 350px;
            z-index: 999;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .toast.success {
            border-color: #2ecc71;
        }

        .toast.error {
            border-color: #e74c3c;
        }

        .toast.warning {
            border-color: #f39c12;
        }

        .historial {
            margin-top: 20px;
            border-top: 1px solid #333;
            padding-top: 16px;
        }

        .historial h3 {
            font-size: 0.95rem;
            margin-bottom: 10px;
        }

        .historial h3 i {
            color: #ffcc00;
            margin-right: 6px;
        }

        .historial-list {
            list-style: none;
            max-height: 200px;
            overflow-y: auto;
        }

        .historial-list li {
            padding: 8px 0;
            border-bottom: 1px solid #222;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            gap: 8px;
        }

        .historial-list li .h-text {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .historial-list li .h-actions button {
            background: none;
            border: none;
            color: #666;
            cursor: pointer;
            padding: 2px 6px;
        }

        .historial-list li .h-actions button:hover {
            color: #fff;
        }

        .historial-list li .h-actions .reuse {
            color: #ffcc00;
        }

        .empty {
            color: #666;
            text-align: center;
            padding: 10px 0;
            font-size: 0.85rem;
        }

        .btn-danger-sm {
            background: #d32f2f;
            color: #fff;
            border: none;
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 0.7rem;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-danger-sm:hover {
            background: #b71c1c;
        }

        @media (max-width: 500px) {
            .container {
                padding: 20px;
            }

            .form-row {
                grid-template-columns: 1fr;
                gap: 0;
            }

            h1 {
                font-size: 1.2rem;
            }

            .actions button {
                flex: 1;
                justify-content: center;
            }
        }

        .debug-info {
            background: #0a0a15;
            border: 1px solid #333;
            border-radius: 6px;
            padding: 10px;
            margin-top: 12px;
            font-size: 0.7rem;
            font-family: monospace;
            color: #666;
            max-height: 100px;
            overflow-y: auto;
            display: none;
        }

        .debug-info.show {
            display: block;
        }

        .debug-info .ok {
            color: #2ecc71;
        }

        .debug-info .error {
            color: #e74c3c;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Generador <span>WhatsApp</span></h1>
        <p class="sub">Crea mensajes con inteligencia artificial (Gemini)</p>

        <div class="form-group">
            <label><i class="fa-solid fa-pen"></i> Tema del mensaje</label>
            <input type="text" id="tema" placeholder="Ej: Oferta de camisetas, Recordatorio...">
        </div>

        <div class="form-row">
            <div class="form-group">
                <label><i class="fa-solid fa-face-smile"></i> Tono</label>
                <select id="tono">
                    <option value="formal">Formal</option>
                    <option value="amigable" selected>Amigable</option>
                    <option value="urgente">Urgente</option>
                    <option value="inspirador">Inspirador</option>
                </select>
            </div>
            <div class="form-group">
                <label><i class="fa-solid fa-ruler"></i> Longitud</label>
                <select id="longitud">
                    <option value="corto">Corto</option>
                    <option value="medio" selected>Medio</option>
                    <option value="largo">Largo</option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label><i class="fa-solid fa-circle-info"></i> Contexto (opcional)</label>
            <textarea id="contexto" rows="2" placeholder="Ej: Descuento del 20% para clientes frecuentes"></textarea>
        </div>

        <button class="btn" id="btnGenerar"><i class="fa-solid fa-wand-magic-sparkles"></i> Generar mensaje</button>

        <div class="result-box" id="resultado">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
                <strong style="color:#ffcc00;"><i class="fa-solid fa-message"></i> Mensaje generado</strong>
                <span style="font-size:0.7rem;color:#666;" id="tiempo"></span>
            </div>
            <div class="text" id="mensaje">✍️ Escribe un tema y haz clic en "Generar"</div>
            <div class="actions">
                <button class="btn-copy" id="btnCopiar"><i class="fa-regular fa-clipboard"></i> Copiar</button>
                <button class="btn-wa" id="btnWhatsApp"><i class="fa-brands fa-whatsapp"></i> WhatsApp</button>
                <button class="btn-save" id="btnGuardar"><i class="fa-regular fa-floppy-disk"></i> Guardar</button>
                <button id="btnLimpiar"><i class="fa-regular fa-trash-can"></i> Limpiar</button>
            </div>
        </div>

        <div class="historial">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
                <h3><i class="fa-regular fa-clock"></i> Historial</h3>
                <button class="btn-danger-sm" id="btnBorrar"><i class="fa-regular fa-trash-can"></i> Borrar
                    todo</button>
            </div>
            <ul class="historial-list" id="historialList">
                <li class="empty"><i class="fa-regular fa-inbox"></i> No hay mensajes guardados</li>
            </ul>
        </div>

        <div class="debug-info" id="debugInfo"></div>
    </div>

    <div id="toast" class="toast"></div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <script>
        // ============================================================
        // FIREBASE
        // ============================================================
        const fbConfig = {
            apiKey: "AIzaSyDvp_6UFymZZnqxMyL6yobJ3twLMvVkThw",
            authDomain: "base-entradas-tenchos.firebaseapp.com",
            projectId: "base-entradas-tenchos",
            storageBucket: "base-entradas-tenchos.firebasestorage.app",
            messagingSenderId: "273676503007",
            appId: "1:273676503007:web:56180c485b648ef076a66a"
        };

        let db = null;
        try {
            if (typeof firebase !== 'undefined') {
                if (!firebase.apps.length) firebase.initializeApp(fbConfig);
                db = firebase.firestore();
                console.log('✅ Firebase conectado');
            }
        } catch (e) { console.warn('⚠️ Firebase error:', e); }

        // ============================================================
        // WORKER URL
        // ============================================================
        const WORKER = 'https://generador-whatsapp.tavoramirezmusico.workers.dev/';
        // ============================================================
        // DOM
        // ============================================================
        const tema = document.getElementById('tema');
        const tono = document.getElementById('tono');
        const longitud = document.getElementById('longitud');
        const contexto = document.getElementById('contexto');
        const btnGen = document.getElementById('btnGenerar');
        const btnCopy = document.getElementById('btnCopiar');
        const btnWA = document.getElementById('btnWhatsApp');
        const btnSave = document.getElementById('btnGuardar');
        const btnClear = document.getElementById('btnLimpiar');
        const btnBorrar = document.getElementById('btnBorrar');
        const resultado = document.getElementById('resultado');
        const mensaje = document.getElementById('mensaje');
        const tiempo = document.getElementById('tiempo');
        const historial = document.getElementById('historialList');
        const toast = document.getElementById('toast');
        const debugInfo = document.getElementById('debugInfo');

        // ============================================================
        // TOAST
        // ============================================================
        function mostrarToast(texto, tipo = 'info') {
            toast.textContent = texto;
            toast.className = 'toast show';
            if (tipo === 'success') toast.classList.add('success');
            else if (tipo === 'error') toast.classList.add('error');
            else if (tipo === 'warning') toast.classList.add('warning');
            clearTimeout(toast._timeout);
            toast._timeout = setTimeout(() => toast.classList.remove('show'), 3500);
        }

        function logDebug(texto, tipo = 'info') {
            debugInfo.classList.add('show');
            const span = document.createElement('span');
            span.textContent = '> ' + texto + '\n';
            span.className = tipo === 'error' ? 'error' : (tipo === 'ok' ? 'ok' : '');
            debugInfo.appendChild(span);
            debugInfo.scrollTop = debugInfo.scrollHeight;
        }

        // ============================================================
        // GENERAR
        // ============================================================
        async function generar() {
            const t = tema.value.trim();
            if (!t) { mostrarToast('⚠️ Escribe un tema', 'warning'); tema.focus(); return; }

            resultado.classList.add('show');
            mensaje.className = 'text loading';
            mensaje.textContent = '⏳ Generando...';
            tiempo.textContent = '';
            btnGen.disabled = true;
            btnGen.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Generando...';
            debugInfo.innerHTML = '';
            debugInfo.classList.remove('show');

            logDebug('📤 Enviando solicitud al Worker...', 'info');

            try {
                const body = JSON.stringify({
                    tema: t,
                    tono: tono.value,
                    longitud: longitud.value,
                    contexto: contexto.value.trim()
                });

                logDebug('📦 Datos: ' + body, 'info');

                const res = await fetch(WORKER, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: body
                });

                const data = await res.json();

                logDebug('📥 Respuesta recibida', 'ok');

                if (data.success) {
                    mensaje.className = 'text';
                    mensaje.textContent = data.texto;
                    tiempo.textContent = '✅ ' + new Date().toLocaleString();
                    mostrarToast('✅ Mensaje generado', 'success');
                    logDebug('✅ Texto generado: ' + data.texto.substring(0, 50) + '...', 'ok');
                } else {
                    mensaje.className = 'text';
                    mensaje.textContent = '❌ ' + (data.error || 'Error desconocido');
                    mostrarToast('❌ Error al generar', 'error');
                    logDebug('❌ Error: ' + (data.error || 'Error desconocido'), 'error');
                }
            } catch (error) {
                mensaje.className = 'text';
                mensaje.textContent = '❌ Error de conexión: ' + error.message;
                mostrarToast('❌ Error de conexión', 'error');
                logDebug('❌ Error de conexión: ' + error.message, 'error');
            }

            btnGen.disabled = false;
            btnGen.innerHTML = '<i class="fa-solid fa-wand-magic-sparkles"></i> Generar mensaje';
        }

        // ============================================================
        // COPIAR
        // ============================================================
        function copiar() {
            const txt = mensaje.textContent;
            if (!txt || txt.includes('❌') || txt.includes('⏳')) {
                mostrarToast('⚠️ No hay mensaje válido', 'warning');
                return;
            }
            navigator.clipboard.writeText(txt)
                .then(() => mostrarToast('✅ Copiado', 'success'))
                .catch(() => {
                    const ta = document.createElement('textarea');
                    ta.value = txt;
                    document.body.appendChild(ta);
                    ta.select();
                    document.execCommand('copy');
                    document.body.removeChild(ta);
                    mostrarToast('✅ Copiado', 'success');
                });
        }

        // ============================================================
        // WHATSAPP
        // ============================================================
        function whatsapp() {
            const txt = mensaje.textContent;
            if (!txt || txt.includes('❌') || txt.includes('⏳')) {
                mostrarToast('⚠️ No hay mensaje válido', 'warning');
                return;
            }
            window.open('https://wa.me/?text=' + encodeURIComponent(txt), '_blank');
        }

        // ============================================================
        // GUARDAR
        // ============================================================
        async function guardar() {
            const txt = mensaje.textContent;
            if (!txt || txt.includes('❌') || txt.includes('⏳')) {
                mostrarToast('⚠️ No hay mensaje válido', 'warning');
                return;
            }
            if (!db) { mostrarToast('⚠️ Firestore no disponible', 'warning'); return; }

            try {
                await db.collection('mensajes_generados').add({
                    texto: txt,
                    tema: tema.value.trim() || 'Sin tema',
                    tono: tono.value,
                    fecha: new Date().toISOString()
                });
                mostrarToast('💾 Guardado', 'success');
                cargarHistorial();
            } catch (e) { mostrarToast('❌ Error al guardar', 'error'); }
        }

        // ============================================================
        // LIMPIAR
        // ============================================================
        function limpiar() {
            resultado.classList.remove('show');
            mensaje.textContent = '✍️ Escribe un tema y haz clic en "Generar"';
            tiempo.textContent = '';
            debugInfo.innerHTML = '';
            debugInfo.classList.remove('show');
        }

        // ============================================================
        // HISTORIAL
        // ============================================================
        async function cargarHistorial() {
            if (!db) {
                historial.innerHTML = '<li class="empty"><i class="fa-solid fa-triangle-exclamation"></i> Firestore no disponible</li>';
                return;
            }
            try {
                const snap = await db.collection('mensajes_generados')
                    .orderBy('fecha', 'desc')
                    .limit(15)
                    .get();

                if (snap.empty) {
                    historial.innerHTML = '<li class="empty"><i class="fa-regular fa-inbox"></i> No hay mensajes guardados</li>';
                    return;
                }

                let html = '';
                snap.forEach(doc => {
                    const d = doc.data();
                    const fecha = d.fecha ? new Date(d.fecha) : new Date();
                    const preview = (d.texto || 'Sin texto').substring(0, 50) + '...';
                    html += `
                <li>
                    <span class="h-text" title="${sanitizar(d.texto || '')}">${sanitizar(preview)}</span>
                    <span style="font-size:0.65rem;color:#666;">${formatearFecha(fecha)}</span>
                    <span class="h-actions">
                        <button class="reuse" data-id="${doc.id}" title="Reutilizar"><i class="fa-solid fa-rotate-right"></i></button>
                        <button data-id="${doc.id}" title="Eliminar" class="delete-btn"><i class="fa-regular fa-trash-can"></i></button>
                    </span>
                </li>
            `;
                });
                historial.innerHTML = html;

                document.querySelectorAll('.reuse').forEach(b => {
                    b.addEventListener('click', function () { reutilizar(this.dataset.id); });
                });
                document.querySelectorAll('.delete-btn').forEach(b => {
                    b.addEventListener('click', function () { eliminar(this.dataset.id); });
                });

            } catch (e) {
                historial.innerHTML = '<li class="empty"><i class="fa-solid fa-triangle-exclamation"></i> Error al cargar</li>';
            }
        }

        async function reutilizar(id) {
            if (!db) return;
            try {
                const doc = await db.collection('mensajes_generados').doc(id).get();
                if (!doc.exists) return;
                const d = doc.data();
                mensaje.className = 'text';
                mensaje.textContent = d.texto || 'Sin contenido';
                tiempo.textContent = '📂 Reutilizado';
                resultado.classList.add('show');
                if (d.tema) tema.value = d.tema;
                if (d.tono) tono.value = d.tono;
                mostrarToast('📂 Mensaje cargado', 'success');
            } catch (e) { mostrarToast('❌ Error', 'error'); }
        }

        async function eliminar(id) {
            if (!confirm('¿Eliminar este mensaje?')) return;
            if (!db) return;
            try {
                await db.collection('mensajes_generados').doc(id).delete();
                mostrarToast('🗑️ Eliminado', 'success');
                cargarHistorial();
            } catch (e) { mostrarToast('❌ Error', 'error'); }
        }

        async function borrarTodo() {
            if (!confirm('⚠️ ¿Borrar TODO el historial?')) return;
            if (!db) return;
            try {
                const snap = await db.collection('mensajes_generados').get();
                if (snap.empty) { mostrarToast('⚠️ No hay mensajes', 'warning'); return; }
                const batch = db.batch();
                snap.forEach(doc => batch.delete(doc.ref));
                await batch.commit();
                mostrarToast('🗑️ Historial borrado', 'success');
                cargarHistorial();
            } catch (e) { mostrarToast('❌ Error', 'error'); }
        }

        // ============================================================
        // UTILIDADES
        // ============================================================
        function sanitizar(t) { if (!t) return ''; const d = document.createElement('div'); d.textContent = t; return d.innerHTML; }
        function formatearFecha(f) {
            if (!f || isNaN(f.getTime())) return 'Fecha inválida';
            return f.toLocaleDateString('es-ES', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
        }

        // ============================================================
        // EVENTOS
        // ============================================================
        btnGen.addEventListener('click', generar);
        btnCopy.addEventListener('click', copiar);
        btnWA.addEventListener('click', whatsapp);
        btnSave.addEventListener('click', guardar);
        btnClear.addEventListener('click', limpiar);
        btnBorrar.addEventListener('click', borrarTodo);

        tema.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); generar(); } });

        // ============================================================
        // INICIAR
        // ============================================================
        document.addEventListener('DOMContentLoaded', () => {
            cargarHistorial();
            console.log('🤖 Generador cargado');
            console.log('📡 Worker:', WORKER);
            console.log('🔥 Firebase:', !!db);
        });
    </script>

</body>

</html>
