<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirigiendo al Panel Admin...</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a0a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            text-align: center;
        }

        .loader {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .loader img {
            width: 80px;
            height: auto;
        }

        .loader .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #222;
            border-top: 3px solid #ffcc00;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        .loader p {
            color: #888;
            font-size: 0.9rem;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
    <!-- Redirección automática -->
    <meta http-equiv="refresh" content="0; url=login.html">
</head>

<body>
    <div class="loader">
        <img src="../img/logo.webp" alt="Los Hijos de Tencha">
        <div class="spinner"></div>
        <p>Redirigiendo al panel de administración...</p>
    </div>
</body>

</html>
